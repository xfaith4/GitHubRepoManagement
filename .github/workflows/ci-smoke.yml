name: CI Smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run module smoke test
        shell: pwsh
        run: ./scripts/Invoke-ModuleSmokeTest.ps1 -WorkspaceRoot "${{ github.workspace }}"

      - name: Run adapter smoke test
        shell: pwsh
        run: ./scripts/Invoke-AdapterSmokeTest.ps1 -WorkspaceRoot "${{ github.workspace }}"

      - name: Run API host smoke test
        shell: pwsh
        run: ./scripts/Invoke-ApiHostSmokeTest.ps1 -WorkspaceRoot "${{ github.workspace }}"
