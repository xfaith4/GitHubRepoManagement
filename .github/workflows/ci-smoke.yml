name: CI Smoke

# One list, two runners: this workflow invokes scripts/Invoke-TestSuite.ps1 —
# the same command `npm test` runs locally — so CI and local verification
# cannot drift apart. Do NOT re-inline individual gates here; add new gates to
# Invoke-TestSuite.ps1 and they run in both places. A module-smoke tripwire
# (ROADMAP Lane 0.8) fails if this file stops invoking the suite, hollows it
# with -SkipApiHost, or filters paths so some PRs merge ungated.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The suite runs as three parallel jobs, one per shard of
  # Invoke-TestSuite.ps1, so the wall clock is the slowest shard rather than
  # the sum of every gate. Every gate names its shard; the module-smoke
  # tripwire fails if a shard the suite declares is missing from this matrix.
  gates:
    name: gates (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [module, host, static]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, not the default shallow fetch: the roadmap
          # capability-record gate resolves origin/main..HEAD to see what this
          # branch proposes, and a depth-1 checkout leaves it unable to verify
          # anything — which it reports as a failure rather than a pass.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run canonical test suite (${{ matrix.shard }} shard)
        shell: pwsh
        run: ./scripts/Invoke-TestSuite.ps1 -WorkspaceRoot "${{ github.workspace }}" -Shard ${{ matrix.shard }}

  # The required status check on main. It passes only when every shard
  # succeeded. `if: always()` matters: without it a failed shard SKIPS this
  # job, and a skipped required check counts as passing.
  smoke:
    needs: gates
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.gates.result }}" = "success"
