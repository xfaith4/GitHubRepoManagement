# .github/workflows/copilot-setup-steps.yml
#
# Provisions the environment GitHub Copilot's cloud agent runs in BEFORE it
# starts a task. The job MUST be named `copilot-setup-steps` for Copilot to
# discover and run it. Everything here exists so the agent can execute the
# project's real validation gates on a cold runner:
#
#   1. npm run build                          (Vite/TypeScript frontend build)
#   2. Invoke-ModuleSmokeTest.ps1             (PowerShell module smoke)
#   3. Test-RoadmapStructure.ps1              (roadmap contract linter, 0 errors)
#
# Platform note: Copilot's cloud agent runs on LINUX. This repo's SQLite
# (Release 2.1) and several git-status paths are Windows/WSL-sensitive, so
# anything validated here is CI-on-Linux evidence only, NOT operator-verified
# on the platform operators actually use. Tag milestones accordingly.

name: "Copilot Setup Steps"

on:
  workflow_dispatch: {}
  # Optional: validate this file on changes to itself so a broken setup file
  # is caught in normal CI rather than only when the agent next runs.
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Job name is REQUIRED to be exactly `copilot-setup-steps`.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Give the agent's environment the token scope its GitHub-metadata paths
    # need (Portfolio.Assessment.ps1 reads Actions/Pages/PR status via `gh`).
    # Widen only if a task legitimately needs to write.
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # --- Node / frontend toolchain -------------------------------------
      # No `engines` field and no committed package-lock.json, so pin Node
      # explicitly rather than inheriting the runner default. Use npm install
      # (not npm ci) because there is no lockfile to honor.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      # KNOWN DEFECT: npm's optional-dependency resolution intermittently
      # drops Rollup's platform-native binary, which breaks `vite build`. This
      # repo ships `ensure-rollup-native.mjs` (run via the build script) and an
      # `install:frontend` repair path for exactly this. Run the repair
      # explicitly on the cold runner so the agent's first build does not fail
      # for an environment reason unrelated to its code.
      - name: Repair Rollup native dependency (known cold-install defect)
        run: |
          if npm run | grep -q "install:frontend"; then
            npm run install:frontend
          else
            node ./scripts/ensure-rollup-native.mjs || node ./ensure-rollup-native.mjs || true
          fi

      # Prove the frontend gate is green in this environment before handing
      # off. If the agent inherits a build that already fails, it cannot tell
      # its own regressions from pre-existing breakage.
      - name: Verify frontend build gate
        run: npm run build

      # --- PowerShell toolchain ------------------------------------------
      # ubuntu-latest ships pwsh (PowerShell 7). The gates run under pwsh, so
      # no install is needed — but confirm it and pin nothing brittle.
      - name: Verify PowerShell (pwsh) is available
        shell: bash
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      # Pester is NOT preinstalled and the roadmap test suite requires it
      # (#Requires -Modules Pester). PSScriptAnalyzer is used by the roadmap
      # validation signals, so provision it too. CurrentUser scope keeps this
      # self-contained to the runner.
      - name: Install PowerShell modules (Pester, PSScriptAnalyzer)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Import-Module Pester -MinimumVersion 5.0.0
          Import-Module PSScriptAnalyzer
          Write-Host "Pester:         $((Get-Module Pester).Version)"
          Write-Host "PSScriptAnalyzer: $((Get-Module PSScriptAnalyzer).Version)"

      # --- Gate discoverability check ------------------------------------
      # Resolve the gate scripts up front and fail loudly if a path drifted,
      # so the agent gets an unambiguous signal here rather than a cryptic
      # "file not found" mid-task. Checks both the documented (tools/, scripts/)
      # and root-level locations.
      - name: Locate validation gate scripts
        shell: pwsh
        run: |
          $gates = @{
            'Roadmap linter'      = @('tools/Test-RoadmapStructure.ps1', 'Test-RoadmapStructure.ps1')
            'Module smoke'        = @('scripts/Invoke-ModuleSmokeTest.ps1', 'Invoke-ModuleSmokeTest.ps1')
          }
          $missing = @()
          foreach ($name in $gates.Keys) {
            $found = $gates[$name] | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if ($found) { Write-Host "[found] $name -> $found" }
            else { $missing += $name; Write-Warning "[missing] $name (looked in: $($gates[$name] -join ', '))" }
          }
          if ($missing.Count -gt 0) {
            throw "Validation gate script(s) not found: $($missing -join ', '). Update paths in this setup file or the repo."
          }

      # --- Smoke-verify the roadmap contract linter ----------------------
      # Cheap, deterministic, and confirms the linter runs in this environment.
      # Non-fatal on advisory warnings; the agent should still aim for 0 errors.
      - name: Smoke-check roadmap linter
        shell: pwsh
        run: |
          $linter = @('tools/Test-RoadmapStructure.ps1','Test-RoadmapStructure.ps1') |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File $linter -Path ./ROADMAP.md

      # NOTE: Invoke-ApiHostSmokeTest.ps1 is deliberately NOT run here. It has
      # a known hang past the Release 2.0 quota-refusal route; running it in an
      # autonomous environment risks burning the agent's time budget on a
      # deadlock. Close that defect before wiring it into setup or agent gates.
