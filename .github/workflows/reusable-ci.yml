name: reusable-ci

on:
  workflow_call:
    inputs:
      node:
        type: boolean
        default: false
      python:
        type: boolean
        default: false
      dotnet:
        type: boolean
        default: false
      node-version:
        type: string
        default: "20"
      python-version:
        type: string
        default: "3.12"
      dotnet-version:
        type: string
        default: "8.0.x"
      working-directory:
        type: string
        default: "."
      timeout-minutes:
        type: number
        default: 20

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        if: ${{ inputs.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Setup Python
        if: ${{ inputs.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements.txt

      - name: Setup .NET
        if: ${{ inputs.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Install dependencies
        run: |
          if [ "${{ inputs.node }}" = "true" ] && [ -f package-lock.json ]; then npm ci; fi
          if [ "${{ inputs.python }}" = "true" ] && [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ "${{ inputs.dotnet }}" = "true" ]; then dotnet restore; fi

      - name: Lint
        run: |
          if [ "${{ inputs.node }}" = "true" ] && [ -f package.json ] && node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)"; then
            npm run lint
          fi

          if [ "${{ inputs.python }}" = "true" ] && grep -q ruff requirements.txt 2>/dev/null; then
            ruff check .
          fi

      - name: Build
        run: |
          if [ "${{ inputs.node }}" = "true" ] && [ -f package.json ] && node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            npm run build
          fi

          if [ "${{ inputs.dotnet }}" = "true" ]; then
            dotnet build --no-restore --configuration Release
          fi

      - name: Test
        run: |
          if [ "${{ inputs.node }}" = "true" ] && [ -f package.json ] && node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            npm test -- --ci
          fi

          if [ "${{ inputs.python }}" = "true" ] && grep -q pytest requirements.txt 2>/dev/null; then
            pytest -q
          fi

          if [ "${{ inputs.dotnet }}" = "true" ]; then
            dotnet test --no-build --configuration Release
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ github.run_id }}
          path: |
            **/TestResults/**
            **/coverage/**
            **/test-results/**
          if-no-files-found: ignore
