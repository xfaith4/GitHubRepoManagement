name: CI Smoke

# One list, two runners: this workflow invokes scripts/Invoke-TestSuite.ps1 —
# the same command `npm test` runs locally — so CI and local verification
# cannot drift apart. Do NOT re-inline individual gates here; add new gates to
# Invoke-TestSuite.ps1 and they run in both places. A module-smoke tripwire
# (ROADMAP Lane 0.8) fails if this file stops invoking the suite, hollows it
# with -SkipApiHost, or filters paths so some PRs merge ungated.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run canonical test suite
        shell: pwsh
        run: ./scripts/Invoke-TestSuite.ps1 -WorkspaceRoot "${{ github.workspace }}"
