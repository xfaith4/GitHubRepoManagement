name: CI Smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run module smoke test
        shell: pwsh
        run: ./scripts/Invoke-ModuleSmokeTest.ps1 -WorkspaceRoot "${{ github.workspace }}"

      - name: Run adapter smoke test
        shell: pwsh
        run: ./scripts/Invoke-AdapterSmokeTest.ps1 -WorkspaceRoot "${{ github.workspace }}"

      - name: Run API host smoke test
        shell: pwsh
        run: ./scripts/Invoke-ApiHostSmokeTest.ps1 -WorkspaceRoot "${{ github.workspace }}"

      - name: Run API contract test
        shell: pwsh
        run: ./scripts/Invoke-ApiContractTest.ps1 -WorkspaceRoot "${{ github.workspace }}"

      - name: Run auth smoke test (Release 2.2)
        shell: pwsh
        run: ./scripts/Invoke-AuthSmokeTest.ps1 -WorkspaceRoot "${{ github.workspace }}"

      - name: Audit repository structure
        shell: pwsh
        run: ./scripts/Invoke-RepositoryStructureAudit.ps1 -WorkspaceRoot "${{ github.workspace }}"

      - name: Check doc-standards.json integrity
        shell: pwsh
        run: |
          $path = "${{ github.workspace }}/backend/config/doc-standards.json"
          if (-not (Test-Path -LiteralPath $path)) { throw "doc-standards.json not found at $path" }
          $content = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          $parsed = ConvertFrom-Json -InputObject $content
          if ($null -eq $parsed.requiredRootFiles) { throw "doc-standards.json missing requiredRootFiles" }
          if ($null -eq $parsed.readmeStandards) { throw "doc-standards.json missing readmeStandards" }
          Write-Host "doc-standards.json valid: $(@($parsed.requiredRootFiles).Count) required file specs"

      - name: Check roadmap standard assets integrity
        shell: pwsh
        run: |
          $rulesPath    = "${{ github.workspace }}/standards/roadmap/roadmap-audit-rules.json"
          $schemaPath   = "${{ github.workspace }}/standards/roadmap/roadmap-contract.schema.json"
          $templatePath = "${{ github.workspace }}/standards/roadmap/ROADMAP_TEMPLATE.md"
          $maturityPath = "${{ github.workspace }}/standards/roadmap/ROADMAP_MATURITY_MODEL.md"
          $repairPath   = "${{ github.workspace }}/standards/roadmap/roadmap-repair-prompt.md"
          foreach ($p in @($rulesPath, $schemaPath, $templatePath, $maturityPath, $repairPath)) {
              if (-not (Test-Path -LiteralPath $p)) { throw "Roadmap standard asset not found: $p" }
          }
          $rules = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $rulesPath -Raw -Encoding UTF8)
          if ($null -eq $rules.rules)              { throw "roadmap-audit-rules.json missing 'rules' array" }
          if ($null -eq $rules.maturityThresholds) { throw "roadmap-audit-rules.json missing 'maturityThresholds'" }
          if (@($rules.rules).Count -eq 0)         { throw "roadmap-audit-rules.json 'rules' array is empty" }
          $schema = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $schemaPath -Raw -Encoding UTF8)
          if ($null -eq $schema.properties)        { throw "roadmap-contract.schema.json missing 'properties'" }
          Write-Host "Roadmap standard assets valid: $(@($rules.rules).Count) audit rules, $(@($rules.maturityThresholds.PSObject.Properties).Count) maturity levels"

      - name: Validate ROADMAP.md structure
        shell: pwsh
        run: ./tools/Test-RoadmapStructure.ps1 -Path "${{ github.workspace }}/ROADMAP.md" -FailOnError
